[package]
name = "trxviz"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "TRXViz"
identifier = "com.trxviz.app"
icon = ["assets/icon.icns"]
category = "public.app-category.medical"

[dependencies]
trxviz-core = { path = "../trxviz-core" }
trx-rs = { git = "https://github.com/tee-ar-ex/trx-rs", branch = "main" }
eframe = { version = "0.33", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.33"
egui-wgpu = "0.33"
egui-snarl = { version = "0.9.0", features = ["serde"] }
egui_tiles = { version = "0.14", features = ["serde"] }
wgpu = "27"
glam = { version = "0.29", features = ["bytemuck"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"

[lints]
workspace = true
