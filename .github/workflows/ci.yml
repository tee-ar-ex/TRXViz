name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny correctness/suspicious)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious -A clippy::approx_constant

  test:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  machete:
    name: Unused Dependencies (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check for unused dependencies
        # machete exits 0 when clean, non-zero when unused deps found.
        # Run with --with-metadata to also catch dev/build deps.
        run: cargo machete --with-metadata

  core-no-egui:
    name: trxviz-core must not depend on egui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert no egui in core dep tree
        run: |
          count=$(cargo tree -p trxviz-core | grep -ic egui || true)
          if [ "$count" -gt 0 ]; then
            echo "ERROR: egui found in trxviz-core dependency tree!"
            cargo tree -p trxviz-core | grep -i egui
            exit 1
          fi
          echo "OK: no egui in trxviz-core dep tree"
