name: Build Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: trxviz-linux
            binary: trxviz
            archive: TRXViz-linux.tar.gz
          - os: windows-latest
            artifact_name: trxviz-windows
            binary: trxviz.exe
            archive: TRXViz-windows.zip
          - os: macos-latest
            artifact_name: trxviz-macos
            binary: trxviz
            archive: TRXViz-macos.dmg

    steps:
      - uses: actions/checkout@v5
        with:
          path: trxviz

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: trxviz

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxext-dev \
            libglib2.0-dev \
            libgtk-3-dev

      - name: Build (release)
        working-directory: trxviz
        run: cargo build -p trxviz -p trxviz-cli --release

      # ── macOS: .app bundle + .dmg ─────────────────────────────────────────
      - name: Package macOS .app and .dmg
        if: runner.os == 'macOS'
        working-directory: trxviz
        run: |
          APP="target/release/TRXViz.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RESOURCES_DIR="$APP/Contents/Resources"
          STAGING_DIR="target/release/dmg-root"
          APP_VERSION="$(grep '^version' trxviz/Cargo.toml | head -n1 | sed 's/.*= "\(.*\)"/\1/')"
          BUILD_VERSION="${GITHUB_RUN_NUMBER}"

          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR" "$STAGING_DIR"
          cp target/release/trxviz "$MACOS_DIR/TRXViz"
          cp target/release/trxviz-cli "$MACOS_DIR/trxviz-cli"
          chmod +x "$MACOS_DIR/TRXViz" "$MACOS_DIR/trxviz-cli"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>TRXViz</string>
            <key>CFBundleDisplayName</key><string>TRXViz</string>
            <key>CFBundleIdentifier</key><string>com.trxviz.app</string>
            <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
            <key>CFBundleVersion</key><string>${BUILD_VERSION}</string>
            <key>CFBundleExecutable</key><string>TRXViz</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          if [ -f trxviz/assets/icon.icns ]; then
            cp trxviz/assets/icon.icns "$RESOURCES_DIR/"
          fi

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ditto "$APP" "$STAGING_DIR/TRXViz.app"
          hdiutil create \
            -volname "TRXViz" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "target/release/TRXViz-macos.dmg"

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: trxviz/target/release/TRXViz-macos.dmg

      # ── Windows: zip GUI + CLI ────────────────────────────────────────────
      - name: Package Windows .zip
        if: runner.os == 'Windows'
        working-directory: trxviz
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\release\trxviz.exe, target\release\trxviz-cli.exe `
            -DestinationPath target\release\TRXViz-windows.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: trxviz/target/release/TRXViz-windows.zip

      # ── Linux: tar.gz GUI + CLI ───────────────────────────────────────────
      - name: Package Linux .tar.gz
        if: runner.os == 'Linux'
        working-directory: trxviz
        run: |
          tar -czf target/release/TRXViz-linux.tar.gz \
            -C target/release trxviz trxviz-cli

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: trxviz/target/release/TRXViz-linux.tar.gz

  build-linux-legacy:
    name: Build (linux-legacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: trxviz

      - name: Build in Debian 11 container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/trxviz:/work" \
            -w /work \
            debian:11 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              apt-get install -y \
                ca-certificates \
                cmake \
                curl \
                gcc \
                g++ \
                git \
                make \
                pkg-config \
                libglib2.0-dev \
                libgtk-3-dev \
                libwayland-dev \
                libx11-dev \
                libxcb-render0-dev \
                libxcb-shape0-dev \
                libxcb-xfixes0-dev \
                libxkbcommon-dev \
                libxkbcommon-x11-dev \
                libxext-dev
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              cargo build -p trxviz -p trxviz-cli --release
            '

      - name: Package Linux legacy .tar.gz
        working-directory: trxviz
        run: |
          tar -czf target/release/TRXViz-linux-legacy.tar.gz \
            -C target/release trxviz trxviz-cli

      - name: Upload Linux legacy artifact
        uses: actions/upload-artifact@v6
        with:
          name: trxviz-linux-legacy
          path: trxviz/target/release/TRXViz-linux-legacy.tar.gz

  release:
    name: Create GitHub Release
    needs: [build, build-linux-legacy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
