[package]
name = "trxviz-core"
version = "0.1.0"
edition = "2024"
description = "Shared workflow, scene, and rendering primitives for TRXViz."
readme = "README.md"
license = "BSD-2-Clause"
documentation = "https://docs.rs/trxviz-core"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.33"
egui-snarl = { version = "0.9.0", features = ["serde"] }
egui_tiles = { version = "0.14", features = ["serde"] }
flate2 = "1"
glam = { version = "0.29", features = ["bytemuck"] }
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lin_alg = "1.3.5"
log = "0.4"
mcubes = "0.1.7"
ndarray = "0.16"
nifti = { version = "0.17", features = ["ndarray_volumes"] }
parking_lot = "0.12"
petgraph = { version = "0.8", features = ["serde-1"] }
pollster = "0.4"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
trx-rs = { git = "https://github.com/tee-ar-ex/trx-rs" }
odx-rs = { git = "https://github.com/PennLINC/odx-rs" }
wgpu = "27"

[lints]
workspace = true
