[package]
name = "trxviz-core"
version = "0.1.0"
edition = "2024"
description = "Shared workflow, scene, and rendering primitives for TRXViz."
readme = "README.md"
license = "BSD-2-Clause"
documentation = "https://docs.rs/trxviz-core"

[features]
default = ["glb-export", "png-export"]
# Enable GLB scene export (no extra deps beyond wgpu/glam already present)
glb-export = []
# Enable PNG readback via the `image` crate
png-export = ["dep:image"]

[dependencies]
anyhow = "1"
thiserror = "2"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
flate2 = "1"
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
lin_alg = "1.3.5"
log = "0.4"
mcubes = "0.1.7"
nifti = { version = "0.17", features = ["ndarray_volumes"] }
petgraph = { version = "0.8", features = ["serde-1"] }
pollster = "0.4"
rayon = "1.10"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
trx-rs = { git = "https://github.com/tee-ar-ex/trx-rs", branch = "main" }
odx-rs = { git = "https://github.com/PennLINC/odx-rs", branch = "main" }
wgpu = "27"

[dev-dependencies]
env_logger = "0.11"

[lints]
workspace = true
